name: Publish PR
on:
    issues:
        types: [labeled]

# The `claude` label on a release issue approves the release: Claude opens the Publish PR.
# A release issue can be filed ahead of time; the PR waits for the label.
permissions: {}

jobs:
    prepare:
        name: Check the release issue
        if: >-
            github.event.label.name == 'claude'
            && github.event.issue.state == 'open'
            && startsWith(github.event.issue.title, 'Release @perfective/build v')
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            version: ${{ steps.release.outputs.version }}
            branch: ${{ steps.release.outputs.branch }}

        steps:
            - name: Read the version from the issue title
              id: release
              working-directory: ${{ runner.temp }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  TITLE: ${{ github.event.issue.title }}
              run: |
                  set -euo pipefail
                  if [[ ! "${TITLE}" =~ ^Release\ @perfective/build\ v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
                      echo "::error::The title must be \"Release @perfective/build vX.Y.Z\"."
                      exit 1
                  fi
                  version="${BASH_REMATCH[1]}"
                  branch="publish-v${version}"
                  if gh api "repos/${REPO}/git/ref/tags/v${version}" > /dev/null 2>&1; then
                      echo "::error::The v${version} tag already exists."
                      exit 1
                  fi
                  # One Publish PR per version: to start over, close the PR and delete the branch.
                  if gh api "repos/${REPO}/git/ref/heads/${branch}" > /dev/null 2>&1; then
                      echo "::error::The ${branch} branch already exists."
                      exit 1
                  fi
                  {
                      echo "version=${version}"
                      echo "branch=${branch}"
                  } >> "${GITHUB_OUTPUT}"

    publish-pr:
        name: Open the Publish PR
        needs: prepare
        concurrency:
            group: publish-pr-${{ needs.prepare.outputs.version }}
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write # Push the Publish branch
            pull-requests: write # Open the Publish PR
            issues: write # Report a failure on the release issue
            id-token: write # Claude GitHub App token (its PRs trigger CI, unlike GITHUB_TOKEN)
        env:
            # Agent mode commits to this branch through the GitHub API (created from `main`).
            CLAUDE_BRANCH: ${{ needs.prepare.outputs.branch }}
            VERSION: ${{ needs.prepare.outputs.version }}

        steps:
            # All history and tags: the changelog covers the commits since the last tag.
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '26.x'

            - name: Install dependencies
              run: npm ci

            # The mechanical part of the Publish commit; Claude writes the changelog and the README.
            - name: Bump the version and update the lockfile
              id: bump
              run: |
                  set -euo pipefail
                  npm version "${VERSION}" --no-git-tag-version
                  npm update
                  echo "last-tag=$(git describe --tags --abbrev=0)" >> "${GITHUB_OUTPUT}"

            - name: Run Claude Code
              id: claude
              uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  # `main` requires signed commits: commit through the GitHub API, so GitHub signs the commit.
                  use_commit_signing: true
                  # A `prompt` runs the action in agent mode: no tracking comment, no `@claude` mention needed.
                  prompt: |
                      Prepare the Publish PR for `@perfective/build` v${{ env.VERSION }}
                      (release issue #${{ github.event.issue.number }}).
                      Follow `AGENTS.md`, especially "Documentation" and "Git and releases".

                      The workflow already set `package.json` to `${{ env.VERSION }}`
                      and ran `npm update`, so `package.json` and `package-lock.json` are ready.
                      Do not change them further.

                      1. Read the release issue: `gh issue view ${{ github.event.issue.number }}`.
                      2. List the commits since the last tag:
                         `git log --format='%h %s' ${{ steps.bump.outputs.last-tag }}..HEAD`.
                         Read a commit with `git show` when its title is not enough.
                      3. Add a `== v${{ env.VERSION }}` section at the top of `CHANGELOG.adoc` (newest first),
                         in the existing style: past-tense bullets that mirror the commit verbs,
                         two blank lines between versions, consumer-relevant changes only
                         (dependency and peer range changes, exports, configs, Gulp tasks, Babel plugins, docs);
                         no CI, workflow, Renovate, AGENTS.md, or ROADMAP.adoc changes.
                      4. Apply to `README.adoc` the README gaps listed in `ROADMAP.adoc`
                         that the commits since the last tag address,
                         and sync the README peer dependency ranges with `package.json`.
                         Use semantic line breaks. Leave `README.adoc` as it is when nothing applies.
                         Do not edit `ROADMAP.adoc`.
                      5. Run `npm run lint`, then `npm run lint:build` and `npm run dist`. Fix any failure
                         in the files you changed; stop and report when a failure is outside them.
                      6. Commit with `mcp__github_file_ops__commit_files`: one commit titled `Publish v${{ env.VERSION }}`,
                         with only the changed files among `package.json`, `package-lock.json`, `CHANGELOG.adoc`,
                         and `README.adoc`. Nothing else goes into this commit.
                      7. Open the PR:
                         `gh pr create --base main --head ${{ env.CLAUDE_BRANCH }} --title "Publish v${{ env.VERSION }}" --body-file <file>`.
                         The body has `Closes #${{ github.event.issue.number }}`, the new changelog section,
                         a summary of the README changes,
                         and the `ROADMAP.adoc` items this release applied, so a follow-up PR removes them.
                         End the body with the italic line `*Written by Claude*`.

                      Do not tag, create a release, or publish to npm: the maintainer signs and pushes the tag,
                      and `publish.yaml` publishes the package and creates the GitHub Release.
                  claude_args: |
                      --model claude-opus-5-5
                      --allowedTools
                      "Read"
                      "Edit"
                      "Write"
                      "Glob"
                      "Grep"
                      "mcp__github_file_ops__commit_files"
                      "Bash(npm run lint)"
                      "Bash(npm run lint:build)"
                      "Bash(npm run dist)"
                      "Bash(npm ls:*)"
                      "Bash(npm view:*)"
                      "Bash(git status)"
                      "Bash(git log:*)"
                      "Bash(git diff:*)"
                      "Bash(git show:*)"
                      "Bash(gh issue view:*)"
                      "Bash(gh pr view:*)"
                      "Bash(gh pr create:*)"
                      --disallowedTools
                      "mcp__github_file_ops__delete_files"
                      "Bash(npm install:*)"
                      "Bash(npm update:*)"
                      "Bash(npm version:*)"
                      "Bash(npm publish:*)"
                      "Bash(git commit:*)"
                      "Bash(git push:*)"
                      "Bash(git tag:*)"
                      "Bash(gh release:*)"

            # The action can succeed without opening a PR (for example, when Claude stops on a failure).
            - name: Check the Publish PR
              if: ${{ !cancelled() }}
              working-directory: ${{ runner.temp }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  NUMBER: ${{ github.event.issue.number }}
                  RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  pr="$(gh pr list --head "${CLAUDE_BRANCH}" --state open --json url --jq '.[0].url')"
                  if [ -n "${pr}" ]; then
                      echo "::notice::Publish PR: ${pr}"
                      exit 0
                  fi
                  gh issue comment "${NUMBER}" --body "$(printf '%s\n\n%s\n' \
                      "The Publish PR for v${VERSION} was not opened (${RUN})." \
                      "Check the Claude step in the log. To retry, delete the \`${CLAUDE_BRANCH}\` branch if it exists, then remove and add the \`claude\` label.")"
                  echo "::error::No open Publish PR from ${CLAUDE_BRANCH}."
                  exit 1
