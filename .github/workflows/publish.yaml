name: Publish
on:
    push:
        tags:
            - 'v*'

# npm trusted publishing is bound to this file name (`publish.yaml`), not to the trigger.
permissions: {}

concurrency:
    group: publish-${{ github.ref }}
    cancel-in-progress: false

jobs:
    verify:
        name: Verify the tag
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            sha: ${{ steps.tag.outputs.sha }}
            name: ${{ steps.tag.outputs.name }}
            version: ${{ steps.tag.outputs.version }}
            dist_tag: ${{ steps.tag.outputs.dist_tag }}

        steps:
            # The tag is checked through the GitHub API:
            # `actions/checkout` does not keep the annotated tag object, and GitHub verifies the signature.
            - name: Check the tag
              id: tag
              working-directory: ${{ runner.temp }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
                  # The commit of the tag push. A rerun keeps it, also when the tag ref moves.
                  COMMIT: ${{ github.sha }}
                  # One key on each line: `SHA256:...` for an SSH key, or the fingerprint of a GPG key.
                  SIGNING_KEYS: ${{ vars.RELEASE_SIGNING_KEYS }}
                  # The armored public keys of the GPG keys in RELEASE_SIGNING_KEYS.
                  GPG_KEYS: ${{ vars.RELEASE_SIGNING_GPG_KEYS }}
              run: |
                  set -euo pipefail
                  if [[ ! "${TAG}" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "::error::${TAG} is not a vX.Y.Z or vX.Y.Z-<prerelease> tag."
                      exit 1
                  fi
                  major="${BASH_REMATCH[1]}"
                  minor="${BASH_REMATCH[2]}"
                  backport="v${major}.${minor}.x"
                  version="${TAG#v}"

                  ref="$(gh api "repos/${REPO}/git/ref/tags/${TAG}")"
                  if [ "$(jq -r '.object.type' <<<"${ref}")" != "tag" ]; then
                      echo "::error::${TAG} is a lightweight tag. Push a signed annotated tag: git tag -s ${TAG}."
                      exit 1
                  fi
                  tag="$(gh api "repos/${REPO}/git/tags/$(jq -r '.object.sha' <<<"${ref}")")"
                  if [ "$(jq -r '.verification.verified' <<<"${tag}")" != "true" ]; then
                      echo "::error::GitHub does not verify the signature of ${TAG}:" \
                          "$(jq -r '.verification.reason' <<<"${tag}")."
                      exit 1
                  fi
                  # GitHub verifies a signature from the key of any user, so the signer key must also be pinned.
                  # Each check verifies the signature itself and reads the key that verified it.
                  # The issuer fingerprint in a GPG signature is only a hint: an unhashed one is not signed.
                  if [ -z "${SIGNING_KEYS//[[:space:]]/}" ]; then
                      echo "::error::The RELEASE_SIGNING_KEYS repository variable is empty."
                      exit 1
                  fi
                  jq -r '.verification.signature' <<<"${tag}" > tag.sig
                  jq -j '.verification.payload' <<<"${tag}" > tag.payload
                  key=
                  primary=
                  case "$(head -n 1 tag.sig)" in
                      '-----BEGIN SSH SIGNATURE-----')
                          key="$(ssh-keygen -Y check-novalidate -n git -s tag.sig < tag.payload 2>/dev/null \
                              | sed -n 's/^Good "git" signature with .* key \(SHA256:[^ ]*\)$/\1/p' || true)"
                          ;;
                      '-----BEGIN PGP SIGNATURE-----')
                          if [ -z "${GPG_KEYS//[[:space:]]/}" ]; then
                              echo "::error::${TAG} has a GPG signature, and RELEASE_SIGNING_GPG_KEYS is empty."
                              exit 1
                          fi
                          GNUPGHOME="$(mktemp -d)"
                          export GNUPGHOME
                          gpg --batch --quiet --import <<<"${GPG_KEYS}" 2>/dev/null || true
                          # gpg must succeed with GOODSIG and VALIDSIG, and without a revoked, expired, or bad status.
                          # VALIDSIG <signing key fingerprint> ... <primary key fingerprint>
                          validsig=
                          if status="$(gpg --batch --trust-model always --status-fd 1 \
                              --verify tag.sig tag.payload 2>/dev/null)" \
                              && grep -q '^\[GNUPG:\] GOODSIG ' <<<"${status}" \
                              && ! grep -Eq '^\[GNUPG:\] (BADSIG|ERRSIG|EXPSIG|EXPKEYSIG|REVKEYSIG) ' \
                                  <<<"${status}"; then
                              validsig="$(awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print $3, $12; exit }' <<<"${status}")"
                          fi
                          read -r key primary <<<"${validsig}" || true
                          key="${key^^}"
                          primary="${primary^^}"
                          ;;
                  esac
                  if [ -z "${key}" ]; then
                      echo "::error::The signature of ${TAG} does not verify with a pinned key."
                      exit 1
                  fi
                  pinned() {
                      [ -n "$1" ] && tr -d ' \t\r' <<<"${SIGNING_KEYS}" | grep -Fxq -- "$1"
                  }
                  if ! pinned "${key}" && ! pinned "${primary}"; then
                      echo "::error::${TAG} is signed with ${key}, which is not in RELEASE_SIGNING_KEYS."
                      exit 1
                  fi
                  if [ "$(jq -r '.object.type' <<<"${tag}")" != "commit" ]; then
                      echo "::error::${TAG} does not point to a commit."
                      exit 1
                  fi
                  sha="$(jq -r '.object.sha' <<<"${tag}")"
                  # The signature covers the tag object, so its name and its commit must be the ones that started this run.
                  if [ "$(jq -r '.tag' <<<"${tag}")" != "${TAG}" ]; then
                      echo "::error::The tag object of ${TAG} has the name $(jq -r '.tag' <<<"${tag}")."
                      exit 1
                  fi
                  if [ "${sha}" != "${COMMIT}" ]; then
                      echo "::error::${TAG} points to ${sha}, and this run started for ${COMMIT}."
                      exit 1
                  fi

                  # Publish only commits that are on `main` or on the backport branch of this version.
                  # The npm dist-tag `latest` is for a non-prerelease on `main` only.
                  # A backport release uses `backport-X.Y`, which is not a semver range.
                  dist_tag=
                  for branch in main "${backport}"; do
                      status="$(gh api "repos/${REPO}/compare/${branch}...${sha}" --jq '.status' 2>/dev/null || true)"
                      if [ "${status}" = "identical" ] || [ "${status}" = "behind" ]; then
                          if [ "${branch}" = main ]; then
                              dist_tag=latest
                          else
                              dist_tag="backport-${major}.${minor}"
                          fi
                          break
                      fi
                  done
                  if [ -z "${dist_tag}" ]; then
                      echo "::error::${TAG} points to ${sha}, which is not on main or ${backport}."
                      exit 1
                  fi

                  package="$(gh api "repos/${REPO}/contents/package.json?ref=${sha}" \
                      -H 'Accept: application/vnd.github.raw')"
                  name="$(jq -r '.name' <<<"${package}")"
                  if [ "$(jq -r '.version' <<<"${package}")" != "${version}" ]; then
                      echo "::error::package.json has version $(jq -r '.version' <<<"${package}"), not ${version}."
                      exit 1
                  fi

                  if [[ "${version}" == *-* ]]; then
                      dist_tag=next
                  fi
                  {
                      echo "sha=${sha}"
                      echo "name=${name}"
                      echo "version=${version}"
                      echo "dist_tag=${dist_tag}"
                  } >> "${GITHUB_OUTPUT}"

            # Fails before publishing when the changelog has no section for this version.
            - name: Check the CHANGELOG.adoc section
              working-directory: ${{ runner.temp }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ steps.tag.outputs.sha }}
                  VERSION: ${{ steps.tag.outputs.version }}
              run: |
                  set -euo pipefail
                  gh api "repos/${REPO}/contents/CHANGELOG.adoc?ref=${SHA}" \
                      -H 'Accept: application/vnd.github.raw' > CHANGELOG.adoc
                  # The `== vX.Y.Z` section, without leading blank lines.
                  # `sed` drops the leading blank lines; `$(...)` drops the trailing ones.
                  notes="$(awk -v heading="== v${VERSION}" '
                      $0 == heading { found = 1; next }
                      found && /^== / { exit }
                      found' CHANGELOG.adoc \
                      | sed -e '/./,$!d')"
                  if [ -z "${notes}" ]; then
                      echo "::error::CHANGELOG.adoc has no == v${VERSION} section."
                      exit 1
                  fi

    # The build runs the code of the dev dependencies, so it has no `id-token` permission.
    build:
        name: Build the package
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.verify.outputs.sha }}
                  # No job token in `.git/config`: the later steps do not use git.
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26.13.1'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run linters
              run: npm run lint:build

            - name: Build package
              run: npm run dist

            - name: Upload the package
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: dist
                  path: dist/
                  if-no-files-found: error
                  # Keeps the package through the approval of the `npm` environment (up to 30 days) and a rerun.
                  retention-days: 30

    # Only this job can get an OIDC token.
    # It does not check out or install the repository, and it runs no package scripts.
    npm:
        name: Publish NPM package
        needs: [verify, build]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: npm
        permissions:
            id-token: write # Required for OIDC (npm trusted publishing and provenance)

        steps:
            - name: Download the package
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: dist
                  path: ${{ runner.temp }}/dist

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26.13.1'
                  registry-url: 'https://registry.npmjs.org'

            # A rerun skips the version npm already has.
            - name: Publish package
              working-directory: ${{ runner.temp }}
              env:
                  NAME: ${{ needs.verify.outputs.name }}
                  VERSION: ${{ needs.verify.outputs.version }}
                  DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
              run: |
                  set -euo pipefail
                  if [ "$(jq -r '.name' dist/package.json)" != "${NAME}" ] \
                      || [ "$(jq -r '.version' dist/package.json)" != "${VERSION}" ]; then
                      echo "::error::dist/package.json is not ${NAME}@${VERSION}."
                      exit 1
                  fi
                  # npm applies `publishConfig` (for example, `registry`) before the OIDC exchange,
                  # also with --ignore-scripts.
                  # This package has none, so the artifact must not have it.
                  if [ "$(jq 'has("publishConfig")' dist/package.json)" != "false" ]; then
                      echo "::error::dist/package.json has publishConfig."
                      exit 1
                  fi
                  if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
                      echo "::notice::${NAME}@${VERSION} is already on npm."
                      exit 0
                  fi
                  npm publish --provenance --ignore-scripts --tag "${DIST_TAG}" ./dist
