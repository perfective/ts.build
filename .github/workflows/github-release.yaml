name: GitHub Release
on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Extract changelog notes
              id: notes
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF_NAME}"
                  version="${tag#v}"
                  notes_file="${RUNNER_TEMP}/release-notes.md"
                  python3 - "${version}" "${notes_file}" <<'PY'
                  import re
                  import sys
                  from pathlib import Path

                  version, out_path = sys.argv[1], sys.argv[2]
                  text = Path("CHANGELOG.adoc").read_text(encoding="utf-8")
                  pattern = rf"(?ms)^== v{re.escape(version)}\s*\n(.*?)(?=^== |\Z)"
                  match = re.search(pattern, text)
                  if match is None:
                      raise SystemExit(f"No CHANGELOG.adoc section for v{version}")
                  body = match.group(1).strip()
                  lines = []
                  for line in body.splitlines():
                      if line.startswith("* "):
                          lines.append(f"- {line[2:]}")
                      elif line.startswith("+"):
                          # AsciiDoc continuation; keep as indented detail
                          lines.append(f"  {line[1:].lstrip()}")
                      elif line.strip() == "":
                          lines.append("")
                      else:
                          lines.append(line)
                  Path(out_path).write_text("\n".join(lines).strip() + "\n", encoding="utf-8")
                  PY
                  echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF_NAME}"
                  gh release create "${tag}" \
                      --title "${tag}" \
                      --notes-file "${{ steps.notes.outputs.notes_file }}" \
                      --verify-tag
